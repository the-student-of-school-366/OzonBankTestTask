name: Go tests

on:
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  test:
    name: Vet and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CGO_ENABLED: '1'
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/ozon_test?sslmode=disable

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ozon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ozon_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run go vet
        run: go vet ./...

      - name: Run tests with race detector
        run: go test -race -count=1 -timeout=5m ./...
